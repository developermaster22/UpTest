<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Editar Producto</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 2rem;
            background-color: #f7f9fc;
        }

        .form-container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 0.5rem;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #1976d2;
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #125a9c;
        }

        hr {
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Editar Producto</h2>
        <form method="post">
            {% csrf_token %}
            {{ producto_form.as_p }}

            <h3>Características del Producto</h3>
            {{ formset.management_form }}
            {% for form in formset %}
                <div class="form-group">
                    <label for="{{ form.nombre.id_for_label }}">Nombre de la Característica</label>
                    {{ form.nombre }}
                </div>

                <div class="form-group">
                    <label for="{{ form.valor.id_for_label }}">Valor de la Característica</label>
                    {{ form.valor }}
                </div>
                <hr>
            {% endfor %}

            <div style="text-align:center;">
                <button type="submit">Guardar Cambios</button>
            </div>
        </form>
    </div>
</body>
<a href="{% url 'lista_productos' %}" class="boton-flotante">Volver a la lista</a>

<style>
.boton-flotante {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background-color: #28a745;
    color: white;
    padding: 12px 20px;
    border-radius: 30px;
    text-decoration: none;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: transform 0.3s ease, background-color 0.3s ease;
    z-index: 1000;
}
.boton-flotante:hover {
    transform: scale(1.1);
    background-color: #218838;
}
</style>
</html>
