<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        h1 {
            background-color: #28a745;
            color: #fff;
            padding: 20px 0;
            text-align: center;
            margin: 0;
        }

        .mensaje-toast {
            text-align: center;
            background: #ffc107;
            color: black;
            padding: 10px;
            margin: 0;
            font-weight: bold;
            animation: fadein 0.5s ease, fadeout 0.5s ease 3.5s;
        }

        @keyframes fadein {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeout {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        form {
            background-color: #fff;
            width: 60%;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        input[type="text"], input[type="number"], input[type="submit"], .add-button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        input[type="submit"], .add-button {
            background-color: #28a745;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            border: none;
        }

        input[type="submit"]:hover, .add-button:hover {
            background-color: #218838;
        }

        .formset-container {
            margin-top: 20px;
        }

        .formset-item {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .add-button {
            background-color: #28a745;
            color: #fff;
            padding: 12px 20px;
            margin-top: 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h1>Inventario de Productos</h1>

    {% if messages %}
    <div class="mensaje-toast" id="mensaje-toast">
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    </div>
    <script>
        // Ocultar el mensaje después de 4 segundos
        setTimeout(function () {
            const toast = document.getElementById('mensaje-toast');
            if (toast) {
                toast.style.display = 'none';
            }
        }, 4000); // 4000 ms = 4 segundos
    </script>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
  
        <h3>Características del Producto</h3>
        {{ formset.management_form }}
        <div id="formset-container" class="formset-container">
            {% for form in formset %}
                <div class="formset-item" data-form-index="{{ forloop.counter0 }}">
                    {{ form.as_p }}
                </div>
            {% endfor %}
        </div>

        <button type="button" id="agregar-caracteristica" class="add-button">+ Agregar Característica</button>

        <input type="submit" value="Guardar Producto">
    </form>
  
    <a href="{% url 'lista_productos' %}">Volver a la lista de productos</a>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const agregarBtn = document.getElementById('agregar-caracteristica'); // Botón para agregar características
            const formsetContainer = document.getElementById('formset-container'); // Contenedor de los formularios
            const totalForms = document.getElementById('id_form-TOTAL_FORMS'); // Campo de cantidad total de formularios

            // Verifica si el contenedor de formularios y el primer formulario existen
            if (agregarBtn && formsetContainer) {
                const firstForm = formsetContainer.querySelector('.formset-item'); // Obtener el primer formulario
                if (firstForm) {
                    agregarBtn.addEventListener('click', function () {
                        const formCount = formsetContainer.querySelectorAll('.formset-item').length;

                        // Clonar el primer formulario
                        const newForm = firstForm.cloneNode(true);

                        // Limpiar los valores de los campos dentro del formulario clonado
                        newForm.querySelectorAll('input, textarea').forEach(input => {
                            input.value = ''; // Limpiar los valores
                            const name = input.name.replace(/-\d+-/, `-${formCount}-`);
                            const id = input.id.replace(/-\d+-/, `-${formCount}-`);
                            input.name = name;
                            input.id = id;
                        });

                        // Agregar el formulario clonado al contenedor
                        formsetContainer.appendChild(newForm);

                        // Actualizar el valor de TOTAL_FORMS
                        totalForms.value = formCount + 1;
                    });
                } else {
                    console.error('No se encontró el formulario base para clonar');
                }
            } else {
                console.error('El contenedor o el botón no se encontraron');
            }
        });
    </script>
</body>
</html>
