<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        h1 {
            background-color: #28a745;
            color: #fff;
            padding: 20px 0;
            text-align: center;
            margin: 0;
        }

        form {
            background-color: #fff;
            width: 60%;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        form:hover {
            transform: scale(1.02); /* Le da un ligero zoom al formulario cuando el cursor pasa por encima */
        }

        input[type="text"], input[type="number"], input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        input[type="submit"] {
            background-color: #28a745;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #218838;
        }

        a {
            display: inline-block;
            text-decoration: none;
            color: #007bff;
            margin-top: 15px;
            font-size: 16px;
            text-align: center;
            transition: color 0.3s ease;
        }

        a:hover {
            text-decoration: underline;
            color: #0056b3;
        }

        .formset-container {
            margin-top: 20px;
        }

        .formset-container .formset-item {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .formset-item:hover {
            background-color: #f9f9f9;
        }

        .formset-item input {
            width: calc(50% - 12px);
            margin-right: 12px;
        }
        

        .formset-item .delete {
            color: red;
            cursor: pointer;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .formset-item .delete:hover {
            color: darkred;
        }

        .delete-confirmation {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .delete-confirmation button {
            background-color: #ff0000;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
        }

        .delete-confirmation button:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <h1>Agregar Producto</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
  
      <h3>Características</h3>
      {{ formset.management_form }}
      <div class="formset-container">
          {% for form in formset %}
              <div class="formset-item">
                  {{ form.as_p }}
                  {% if form.instance.pk %}
                      <span class="delete" onclick="deleteCharacteristic(event)">Eliminar</span>
                  {% endif %}
              </div>
          {% endfor %}
      </div>

      <input type="submit" value="Guardar Producto">
  </form>
  
    <a href="{% url 'lista_productos' %}">Volver a la lista de productos</a>

    <!-- Confirmación de eliminación -->
    <div class="delete-confirmation">
        <p>¿Estás seguro de que deseas eliminar esta característica?</p>
        <button onclick="confirmDeletion()">Confirmar</button>
        <button onclick="cancelDeletion()">Cancelar</button>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function(event) {
            let precio = document.querySelector('input[name="precio"]').value;
            if (isNaN(precio) || precio <= 0) {
                alert('El precio debe ser un número positivo.');
                event.preventDefault();
            }
        });

        function deleteCharacteristic(event) {
            event.preventDefault(); // Evita que se envíe el formulario de inmediato
            const confirmationBox = document.querySelector('.delete-confirmation');
            confirmationBox.style.display = 'block'; // Muestra la confirmación de eliminación
        }

        function confirmDeletion() {
            const formsetItem = document.querySelector('.formset-item');
            formsetItem.style.display = 'none'; // Oculta el elemento mientras se elimina
            document.querySelector('.delete-confirmation').style.display = 'none'; // Oculta la confirmación
        }

        function cancelDeletion() {
            document.querySelector('.delete-confirmation').style.display = 'none'; // Oculta la confirmación
        }
    </script>
</body>
</html>
